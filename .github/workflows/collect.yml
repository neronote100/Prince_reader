name: Collect Discord conversations
on:
  workflow_dispatch:
  schedule:
    # Daily around 08:17 Japan time. GitHub may delay scheduled runs.
    - cron: '17 23 * * *'
permissions:
  contents: read
concurrency:
  group: discord-collection
  cancel-in-progress: false
jobs:
  collect:
    # Set this repository variable after adding all secrets.
    if: vars.ENABLE_DISCORD_SYNC == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption dependency
        run: python -m pip install 'cryptography>=44,<51'
      - name: Collect and encrypt
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_CONFIG: ${{ secrets.DISCORD_CHANNEL_CONFIG }}
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
        run: python batch.py
      - name: Upload encrypted snapshot only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-discord-snapshot
          path: output/discord-snapshot.enc
          if-no-files-found: error
          retention-days: 7
      - name: Remove local plaintext and encrypted copy
        if: always()
        run: rm -rf data output
